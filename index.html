  .delay-400 { animation-delay: 0.4s; }

// ═══════════════════════════════════════
// COMPONENTS
// ═══════════════════════════════════════

const StarRating = ({ rating }) => (
  <div className="flex items-center gap-1">
    <Icon name="star" size={13} className="star-filled" />
    <span className="text-sm font-semibold text-white">{rating}</span>
  </div>
);

const Badge = ({ text, type = "orange" }) => (
  <span className={`px-2 py-0.5 rounded-full text-xs font-bold ${type === 'lime' ? 'tag-lime' : 'tag-orange'}`}>
    {text}
  </span>
);

const MacroBar = ({ label, value, max, color }) => (
  <div>
    <div className="flex justify-between mb-1">
      <span className="text-xs text-gray-400">{label}</span>
      <span className="text-xs font-bold text-white">{value}g</span>
    </div>
    <div className="h-1.5 bg-white/10 rounded-full overflow-hidden">
      <div className={`macro-bar ${color}`} style={{width: `${Math.min((value/max)*100, 100)}%`}} />
    </div>
  </div>
);

// ═══════════════════════════════════════
// NAVBAR
// ═══════════════════════════════════════

const Navbar = ({ page, setPage, cartCount, isLoggedIn, setIsLoggedIn }) => {
  const [mobileOpen, setMobileOpen] = useState(false);
  const [scrolled, setScrolled] = useState(false);

  useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 20);
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);

  return (
    <nav className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${scrolled ? 'glass border-b border-white/5 py-3' : 'py-5'}`}>
      <div className="max-w-7xl mx-auto px-4 sm:px-6 flex items-center justify-between">
        {/* Logo */}
        <button onClick={() => setPage('home')} className="flex items-center gap-2">
          <div className="w-9 h-9 rounded-xl gradient-orange flex items-center justify-center font-display font-black text-white text-lg">Z</div>
          <span className="font-display font-black text-2xl tracking-tight">
            ZA<span className="gradient-text">AVO</span>
          </span>
        </button>

        {/* Center Nav */}
        <div className="hidden md:flex items-center gap-8">
          {[['home','Home'],['restaurants','Restaurants'],['fitness','Gym Meals'],['offers','Offers']].map(([p,l]) => (
            <button key={p} onClick={() => setPage(p)} className={`nav-link font-medium text-sm transition-colors ${page===p ? 'text-white' : 'text-gray-400'}`}>{l}</button>
          ))}
        </div>

        {/* Right Actions */}
        <div className="flex items-center gap-3">
          <button onClick={() => setPage('search')} className="p-2 rounded-xl hover:bg-white/5 transition-colors text-gray-400 hover:text-white">
            <Icon name="search" size={20} />
          </button>
          <button onClick={() => setPage('cart')} className="relative p-2 rounded-xl hover:bg-white/5 transition-colors text-gray-400 hover:text-white">
            <Icon name="cart" size={20} />
            {cartCount > 0 && <span className="notification-dot">{cartCount}</span>}
          </button>
          {isLoggedIn ? (
            <button onClick={() => setPage('profile')} className="w-9 h-9 rounded-xl gradient-orange flex items-center justify-center text-white font-bold text-sm">RS</button>
          ) : (
            <button onClick={() => setPage('login')} className="btn-primary px-5 py-2 rounded-xl text-sm font-semibold font-display">Login</button>
          )}
          <button onClick={() => setMobileOpen(!mobileOpen)} className="md:hidden p-2 rounded-xl hover:bg-white/5 text-gray-400">
            <Icon name="menu" size={20} />
          </button>
        </div>
      </div>

      {/* Mobile Menu */}
      {mobileOpen && (
        <div className="md:hidden glass border-t border-white/5 px-4 py-4 mt-2">
          {[['home','🏠 Home'],['restaurants','🍔 Restaurants'],['fitness','💪 Gym Meals'],['offers','🎉 Offers'],['profile','👤 Profile']].map(([p,l]) => (
            <button key={p} onClick={() => { setPage(p); setMobileOpen(false); }} className="block w-full text-left py-3 text-gray-300 hover:text-white border-b border-white/5 last:border-0 font-medium">{l}</button>
          ))}
        </div>
      )}
    </nav>
  );
};

// ═══════════════════════════════════════
// BOTTOM NAV (Mobile)
// ═══════════════════════════════════════

const BottomNav = ({ page, setPage, cartCount }) => (
  <div className="bottom-nav items-center justify-around px-2 py-3">
    {[['home','Home','home'],['search','Search','search'],['cart','Cart','cart'],['profile','Profile','user']].map(([p,l,icon]) => (
      <button key={p} onClick={() => setPage(p)} className={`flex flex-col items-center gap-1 px-3 relative ${page===p ? 'text-orange-500' : 'text-gray-500'}`}>
        <Icon name={icon} size={22} />
        {p === 'cart' && cartCount > 0 && <span className="notification-dot text-xs">{cartCount}</span>}
        <span className="text-xs font-medium">{l}</span>
      </button>
    ))}
  </div>
);

// FOOD MODAL
// ═══════════════════════════════════════

const FoodModal = ({ food, onClose, onAdd }) => {
  const [qty, setQty] = useState(1);
  const [liked, setLiked] = useState(false);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-content glass border border-white/10 rounded-3xl w-full max-w-md mx-4" onClick={e => e.stopPropagation()}>
        <div className="swipe-indicator mt-4" />
        
        {/* Food Emoji Hero */}
        <div className={`mx-4 rounded-2xl bg-gradient-to-br ${food.dietType === 'veg' ? 'from-green-900/50 to-lime-900/50' : 'from-orange-900/50 to-red-900/50'} flex items-center justify-center text-8xl py-8`}>
          {food.image}
        </div>

        <div className="p-5">
          <div className="flex items-start justify-between mb-3">
            <div>
              <h3 className="font-display font-bold text-xl text-white">{food.name}</h3>
              <p className="text-gray-400 text-sm mt-0.5">{food.restaurant}</p>
            </div>
            <button onClick={() => setLiked(!liked)} className={`p-2 rounded-xl transition-colors ${liked ? 'text-red-400' : 'text-gray-500'}`}>
              <Icon name="heart" size={22} />
            </button>
          </div>

          <div className="flex items-center gap-3 mb-4">
            <StarRating rating={food.rating} />
            <span className={`w-2 h-2 rounded-full ${food.dietType === 'veg' ? 'bg-lime-400' : 'bg-orange-400'}`} />
            <span className="text-xs text-gray-400 capitalize">{food.dietType}</span>
            {food.tags.map(t => <Badge key={t} text={t} type="lime" />)}
          </div>

          {/* Macros */}
          <div className="glass rounded-2xl p-4 mb-4">
            <p className="text-xs text-gray-400 font-semibold uppercase tracking-widest mb-3">Nutrition per serving</p>
            <div className="grid grid-cols-4 gap-2 mb-4">
              {[['🔥', food.calories, 'kcal'],['💪', food.protein+'g', 'Protein'],['🌾', food.carbs+'g', 'Carbs'],['🫙', food.fat+'g', 'Fat']].map(([e,v,l]) => (
                <div key={l} className="text-center">
                  <div className="text-lg mb-1">{e}</div>
                  <div className="font-bold text-white text-sm">{v}</div>
                  <div className="text-xs text-gray-500">{l}</div>
                </div>
              ))}
            </div>
            <div className="space-y-2">
              <MacroBar label="Protein" value={food.protein} max={80} color="bg-blue-400" />
              <MacroBar label="Carbs" value={food.carbs} max={150} color="bg-yellow-400" />
              <MacroBar label="Fat" value={food.fat} max={50} color="bg-orange-400" />
            </div>
          </div>

          {/* Qty + Add */}
          <div className="flex items-center gap-3">
            <div className="flex items-center gap-3 glass rounded-2xl px-4 py-3">
              <button onClick={() => setQty(Math.max(1, qty-1))} className="text-gray-400 hover:text-white transition-colors">
                <Icon name="minus" size={18} />
              </button>
              <span className="font-bold text-white w-5 text-center">{qty}</span>
              <button onClick={() => setQty(qty+1)} className="text-orange-400 hover:text-orange-300 transition-colors">
                <Icon name="plus" size={18} />
              </button>
            </div>
            <button onClick={() => { onAdd(food, qty); onClose(); }} className="btn-primary flex-1 py-3 rounded-2xl font-display font-bold text-base flex items-center justify-center gap-2">
              Add to Cart — ₹{food.price * qty}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
};

const RestaurantsPage = ({ setPage, setSelectedRestaurant }) => {
  const [search, setSearch] = useState('');

  const filtered = RESTAURANTS.filter(r => {
    const matchSearch = r.name.toLowerCase().includes(search.toLowerCase()) || r.cuisine.toLowerCase().includes(search.toLowerCase());
    const matchFilter = filter === 'All' || (filter === 'Open Now' && r.isOpen) || (filter === 'Top Rated' && r.rating >= 4.7) || (filter === 'Budget' && r.price === '₹') || (filter === 'Fitness' && r.cuisine.includes('Fitness'));

    <div className="min-h-screen pt-24 pb-24 px-4">

const CartPage = ({ cart, setCart, setPage }) => {
  const [coupon, setCoupon] = useState('');
  const [discount, setDiscount] = useState(0);
  const [couponMsg, setCouponMsg] = useState('');
  const [address, setAddress] = useState('Hostel Block 7, Room 312, Campus Road');
  const [payMethod, setPayMethod] = useState('UPI');

  const updateQty = (id, delta) => {
    setCart(prev => prev.map(i => i.id === id ? {...i, qty: Math.max(0, i.qty + delta)} : i).filter(i => i.qty > 0));
  };

  const remove = (id) => setCart(prev => prev.filter(i => i.id !== id));

  const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const delivery = subtotal >= 199 ? 0 : 30;
  const total = subtotal + delivery - discount;

  const applyCoupon = () => {
    const codes = { 'CAMPUS20': Math.round(subtotal * 0.2), 'ZAAVO100': 100, 'GYMPOWER': 50, 'NIGHT50': Math.round(subtotal * 0.5) };
    if (codes[coupon.toUpperCase()]) {
      setDiscount(codes[coupon.toUpperCase()]);
      setCouponMsg(`✓ Saved ₹${codes[coupon.toUpperCase()]}!`);
    } else {
      setCouponMsg('✗ Invalid code');
      setDiscount(0);
    }
  };

  if (cart.length === 0) return (
    <div className="min-h-screen pt-24 pb-24 flex items-center justify-center px-4">
      <div className="text-center animate-fade-up">
        <div className="text-8xl mb-6 animate-float">🛒</div>
        <h2 className="font-display font-black text-3xl text-white mb-3">Your cart is empty!</h2>
        <p className="text-gray-400 mb-8">Time to fuel up. Add some meals to get started.</p>
        <button onClick={() => setPage('restaurants')} className="btn-primary px-8 py-4 rounded-2xl font-display font-bold text-lg">Browse Restaurants</button>
      </div>
    </div>
  );

  return (
    <div className="min-h-screen pt-24 pb-24 px-4">
      <div className="max-w-5xl mx-auto">
        <h1 className="font-display font-black text-3xl text-white mb-8">Your Cart ({cart.length} items)</h1>
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
          
          {/* Cart Items */}
          <div className="lg:col-span-2 space-y-3">
            {cart.map(item => (
              <div key={item.id} className="glass border border-white/5 rounded-2xl p-4 flex items-center gap-4">
                <div className="w-16 h-16 rounded-xl bg-white/5 flex items-center justify-center text-4xl shrink-0">{item.image}</div>
                <div className="flex-1 min-w-0">
                  <h4 className="font-semibold text-white text-sm leading-tight truncate">{item.name}</h4>
                  <p className="text-gray-500 text-xs mt-0.5">{item.restaurant}</p>
                  <p className="text-orange-400 font-bold mt-1">₹{item.price * item.qty}</p>
                </div>
                <div className="flex items-center gap-2 shrink-0">
                  <button onClick={() => updateQty(item.id, -1)} className="w-8 h-8 rounded-xl glass border border-white/10 flex items-center justify-center text-gray-400 hover:text-white">
                    <Icon name="minus" size={14} />
                  </button>
                  <span className="font-bold text-white w-5 text-center">{item.qty}</span>
                  <button onClick={() => updateQty(item.id, 1)} className="w-8 h-8 rounded-xl bg-orange-500/20 border border-orange-500/30 flex items-center justify-center text-orange-400 hover:text-orange-300">
                    <Icon name="plus" size={14} />
                  </button>
                  <button onClick={() => remove(item.id)} className="w-8 h-8 rounded-xl hover:bg-red-500/10 flex items-center justify-center text-gray-500 hover:text-red-400 ml-2">
                    <Icon name="x" size={16} />
                  </button>
                </div>
              </div>
            ))}

            {/* Delivery Address */}
            <div className="glass border border-white/5 rounded-2xl p-4 mt-2">
              <h3 className="font-semibold text-white mb-3 flex items-center gap-2"><Icon name="location" size={16} className="text-orange-400" />Delivery Address</h3>
              <input value={address} onChange={e => setAddress(e.target.value)} className="input-field w-full rounded-xl px-4 py-3 text-sm" />
            </div>

            {/* Payment */}
            <div className="glass border border-white/5 rounded-2xl p-4">
              <h3 className="font-semibold text-white mb-3">Payment Method</h3>
              <div className="grid grid-cols-3 gap-2">
                {['UPI','Card','Cash'].map(m => (
                  <button key={m} onClick={() => setPayMethod(m)} className={`py-3 rounded-xl text-sm font-semibold transition-all ${payMethod===m ? 'bg-orange-500 text-white' : 'glass border border-white/5 text-gray-400 hover:text-white'}`}>{m}</button>
                ))}
              </div>
            </div>
          </div>

          {/* Order Summary */}
          <div className="space-y-4">
            {/* Coupon */}
            <div className="glass border border-white/5 rounded-2xl p-4">
              <h3 className="font-semibold text-white mb-3 flex items-center gap-2"><Icon name="tag" size={16} className="text-orange-400" />Apply Coupon</h3>
              <div className="flex gap-2">
                <input value={coupon} onChange={e => setCoupon(e.target.value)} placeholder="Enter code..." className="input-field flex-1 rounded-xl px-3 py-2.5 text-sm" />
                <button onClick={applyCoupon} className="btn-primary px-4 py-2.5 rounded-xl text-sm font-bold">Apply</button>
              </div>
              {couponMsg && <p className={`text-xs mt-2 font-semibold ${couponMsg.startsWith('✓') ? 'text-lime-400' : 'text-red-400'}`}>{couponMsg}</p>}
              <div className="mt-3 flex flex-wrap gap-1">
                {['CAMPUS20','ZAAVO100','GYMPOWER'].map(code => (
                  <button key={code} onClick={() => { setCoupon(code); }} className="text-xs tag-orange px-2 py-1 rounded-lg">{code}</button>
                ))}
              </div>
            </div>

            {/* Bill */}
            <div className="glass border border-white/5 rounded-2xl p-4">
              <h3 className="font-semibold text-white mb-4">Order Summary</h3>
              <div className="space-y-2 text-sm">
                <div className="flex justify-between text-gray-400"><span>Subtotal</span><span>₹{subtotal}</span></div>
                <div className="flex justify-between text-gray-400"><span>Delivery</span><span className={delivery === 0 ? 'text-lime-400' : ''}>{delivery === 0 ? 'FREE' : `₹${delivery}`}</span></div>
                {discount > 0 && <div className="flex justify-between text-lime-400"><span>Discount</span><span>-₹{discount}</span></div>}
                <div className="border-t border-white/5 pt-2 flex justify-between font-display font-bold text-white text-lg">
                  <span>Total</span><span>₹{total}</span>
                </div>
              </div>
              <button onClick={() => setPage('order-tracking')} className="btn-primary w-full py-4 rounded-2xl font-display font-bold text-lg mt-4">
                Place Order — ₹{total}
              </button>
              <div className="flex items-center justify-center gap-2 mt-3 text-gray-500 text-xs">
                <Icon name="shield" size={13} />
                <span>Secure checkout via {payMethod}</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

                <div className="flex-1">
                  <div className={`font-semibold text-sm transition-colors ${i <= step ? 'text-white' : 'text-gray-500'}`}>{s}</div>

        <div className="glass border border-white/5 rounded-2xl p-4 mb-6 flex items-center gap-4">
          <div className="w-12 h-12 rounded-xl gradient-orange flex items-center justify-center">
            <Icon name="bike" size={22} className="text-white" />
          </div>
          <div>
            <div className="font-semibold text-white">Rahul Kumar</div>
            <div className="text-gray-400 text-sm">Delivery Partner · ⭐ 4.9</div>
          </div>
          <button className="ml-auto glass border border-white/10 rounded-xl p-2.5 text-gray-400 hover:text-white">
            <Icon name="phone" size={18} />

        {step === steps.length - 1 && (
          <button onClick={() => setCart([])} className="btn-primary w-full py-4 rounded-2xl font-display font-bold text-lg animate-fade-up">

// SEARCH PAGE
// ═══════════════════════════════════════

const SearchPage = ({ setCart, setSelectedFood, setPage, setSelectedRestaurant }) => {
  const [query, setQuery] = useState('');
  const results = query.length > 1 ? {
    foods: FOODS.filter(f => f.name.toLowerCase().includes(query.toLowerCase()) || f.category.toLowerCase().includes(query.toLowerCase())),
    restaurants: RESTAURANTS.filter(r => r.name.toLowerCase().includes(query.toLowerCase()) || r.cuisine.toLowerCase().includes(query.toLowerCase())),
  } : { foods: [], restaurants: [] };

  const addToCart = (food, qty = 1) => {
    setCart(prev => {
      const existing = prev.find(i => i.id === food.id);
      if (existing) return prev.map(i => i.id === food.id ? {...i, qty: i.qty + qty} : i);
      return [...prev, {...food, qty}];
    });
  };

  const trending = ['Chicken Bowl','Maggi','Protein Shake','Biryani','Vegan Wrap','Keto Platter'];

  return (
    <div className="min-h-screen pt-24 pb-24 px-4">
      <div className="max-w-4xl mx-auto">
        <div className="relative mb-8">
          <Icon name="search" size={20} className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500" />
          <input autoFocus value={query} onChange={e => setQuery(e.target.value)} className="input-field w-full rounded-2xl pl-12 pr-4 py-4 text-lg" placeholder="Search meals, restaurants, cuisines..." />
          {query && <button onClick={() => setQuery('')} className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white"><Icon name="x" size={18} /></button>}
        </div>

        {!query && (
          <div>
            <h3 className="font-display font-bold text-white mb-4">Trending Searches</h3>
            <div className="flex flex-wrap gap-2">
              {trending.map(t => (
                <button key={t} onClick={() => setQuery(t)} className="cuisine-chip px-4 py-2 rounded-full text-sm">{t}</button>
              ))}
            </div>
          </div>
        )}

        {query && (
          <div>
            {results.restaurants.length > 0 && (
              <div className="mb-8">
                <h3 className="font-display font-bold text-white mb-4">Restaurants ({results.restaurants.length})</h3>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {results.restaurants.map(r => <RestaurantCard key={r.id} r={r} onClick={() => { setSelectedRestaurant(r); setPage('restaurant-detail'); }} />)}
                </div>
              </div>
            )}
            {results.foods.length > 0 && (
              <div>
                <h3 className="font-display font-bold text-white mb-4">Foods ({results.foods.length})</h3>
                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                  {results.foods.map(f => <FoodCard key={f.id} food={f} onOpen={setSelectedFood} onAdd={addToCart} />)}
                </div>
              </div>
            )}
            {results.foods.length === 0 && results.restaurants.length === 0 && (
              <div className="text-center py-20">
                <div className="text-6xl mb-4">🔍</div>
                <p className="text-gray-400">No results for "{query}"</p>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
};

const OffersPage = () => {
  const [copiedCode, setCopiedCode] = useState(null);
  const copyCode = (code) => {
    navigator.clipboard?.writeText(code).catch(() => {});
    setCopiedCode(code);
    setTimeout(() => setCopiedCode(null), 2000);
  };

  return (
    <div className="min-h-screen pt-24 pb-24 px-4">
      <div className="max-w-4xl mx-auto">
        <div className="text-center mb-10">
          <h1 className="font-display font-black text-4xl text-white mb-2">Exclusive Deals 🎉</h1>
          <p className="text-gray-400">Limited time offers crafted for campus life</p>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
          {[...OFFERS, ...OFFERS.map(o => ({...o, id: o.id+10, title: o.title+' Plus', code: o.code+'2'}))].slice(0,6).map(offer => (
            <div key={offer.id} className={`bg-gradient-to-br ${offer.color} rounded-3xl p-7 relative overflow-hidden`}>
              <div className="absolute -right-6 -top-6 text-8xl opacity-15">{offer.icon}</div>
              <div className="text-4xl mb-4">{offer.icon}</div>
              <h3 className="font-display font-black text-white text-2xl mb-2">{offer.title}</h3>
              <p className="text-white/70 mb-5 leading-relaxed">{offer.desc}</p>
              <div className="flex items-center justify-between">
                <button onClick={() => copyCode(offer.code)} className="flex items-center gap-2 bg-black/30 hover:bg-black/40 border border-white/20 rounded-xl px-4 py-2.5 transition-colors">
                  <span className="font-bold text-white tracking-widest">{offer.code}</span>
                  <Icon name={copiedCode === offer.code ? "check" : "copy"} size={15} className={copiedCode === offer.code ? "text-lime-400" : "text-white/60"} />
                </button>
                {copiedCode === offer.code && <span className="text-lime-400 text-sm font-bold animate-fade-in">Copied!</span>}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

// ═══════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════

const App = () => {
  const [page, setPage] = useState('home');
  const [cart, setCart] = useState([]);
  const [selectedRestaurant, setSelectedRestaurant] = useState(null);
  const [selectedFood, setSelectedFood] = useState(null);
  const [isLoggedIn, setIsLoggedIn] = useState(false);

  const cartCount = cart.reduce((s, i) => s + i.qty, 0);

  const renderPage = () => {
    switch(page) {
      case 'home': return <HomePage setPage={setPage} cart={cart} setCart={setCart} setSelectedRestaurant={setSelectedRestaurant} setSelectedFood={setSelectedFood} />;
      case 'restaurants': return <RestaurantsPage setPage={setPage} setSelectedRestaurant={setSelectedRestaurant} />;
      case 'restaurant-detail': return <RestaurantDetailPage restaurant={selectedRestaurant} setCart={setCart} setSelectedFood={setSelectedFood} />;
      case 'fitness': return <FitnessPage setCart={setCart} />;
      case 'cart': return <CartPage cart={cart} setCart={setCart} setPage={setPage} />;
      case 'order-tracking': return <OrderTrackingPage setCart={setCart} />;
      case 'profile': return isLoggedIn ? <ProfilePage setPage={setPage} setIsLoggedIn={setIsLoggedIn} /> : <LoginPage setPage={setPage} setIsLoggedIn={setIsLoggedIn} />;
      case 'login': return <LoginPage setPage={setPage} setIsLoggedIn={setIsLoggedIn} />;
      case 'signup': return <SignupPage setPage={setPage} setIsLoggedIn={setIsLoggedIn} />;
      case 'forgot-password': return <ForgotPasswordPage setPage={setPage} />;
      case 'search': return <SearchPage setCart={setCart} setSelectedFood={setSelectedFood} setPage={setPage} setSelectedRestaurant={setSelectedRestaurant} />;
      case 'offers': return <OffersPage />;
      case 'subscription': return <SubscriptionPage />;
      default: return <HomePage setPage={setPage} cart={cart} setCart={setCart} setSelectedRestaurant={setSelectedRestaurant} setSelectedFood={setSelectedFood} />;
    }
  };

  return (
    <div>
      <Navbar page={page} setPage={setPage} cartCount={cartCount} isLoggedIn={isLoggedIn} setIsLoggedIn={setIsLoggedIn} />
      <main key={page} className="animate-fade-in">
        {renderPage()}
      </main>
      <BottomNav page={page} setPage={setPage} cartCount={cartCount} />

      {/* Food Modal */}
      {selectedFood && (
        <FoodModal
          food={selectedFood}
          onClose={() => setSelectedFood(null)}
          onAdd={(food, qty) => {
            setCart(prev => {
              const existing = prev.find(i => i.id === food.id);
              if (existing) return prev.map(i => i.id === food.id ? {...i, qty: i.qty + qty} : i);
              return [...prev, {...food, qty}];
            });
          }}
        />
      )}

      {/* Cart Toast */}
      {cartCount > 0 && page !== 'cart' && page !== 'order-tracking' && (
        <div className="fixed bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 z-40">
          <button onClick={() => setPage('cart')} className="btn-primary px-6 py-3 rounded-2xl font-display font-bold flex items-center gap-3 animate-pulse-glow shadow-2xl shadow-orange-500/30">
            <Icon name="cart" size={18} />
            <span>{cartCount} item{cartCount > 1 ? 's' : ''} in cart</span>
            <span className="bg-white/20 px-2 py-0.5 rounded-lg text-sm">View →</span>
          </button>
        </div>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
