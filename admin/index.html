  ::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-track { background:#111; } ::-webkit-scrollbar-thumb { background:#FF5722; border-radius:2px; }

// ── Donut Chart (CSS) ──────────────────────────────────────
const DonutChart = ({ segments }) => {
  const total = segments.reduce((s,g) => s+g.value, 0);
  let cum = 0;
  const r = 40, cx = 50, cy = 50, circum = 2*Math.PI*r;
  return (
    <svg viewBox="0 0 100 100" className="w-28 h-28 -rotate-90">
      {segments.map((seg, i) => {
        const pct = seg.value/total;
        const dash = pct*circum;
        const gap  = circum - dash;
        const offset = circum - cum*circum;
        cum += pct;
        return (
          <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={seg.color}
            strokeWidth="16" strokeDasharray={`${dash} ${gap}`} strokeDashoffset={offset} />
        );
      })}
    </svg>
  );
};
