<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>ZAAVO Rider — Delivery Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root { --orange:#FF5722; --lime:#AEEA00; --dark:#0A0A0A; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'DM Sans',sans-serif; background:var(--dark); color:#fff; -webkit-font-smoothing:antialiased; max-width:430px; margin:0 auto; min-height:100vh; }
  .font-display { font-family:'Syne',sans-serif; }
  .glass { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); backdrop-filter:blur(20px); }
  @keyframes fadeUp { from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)} }
  @keyframes ping   { 0%,100%{opacity:1}50%{opacity:0.3} }
  @keyframes pulse-ring { 0%{transform:scale(1);opacity:1}100%{transform:scale(1.8);opacity:0} }
  @keyframes slideIn { from{transform:translateX(100%)}to{transform:translateX(0)} }
  @keyframes countup { from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)} }
  .fade-up    { animation:fadeUp 0.4s ease forwards; }
  .ping       { animation:ping 2s ease-in-out infinite; }
  .slide-in   { animation:slideIn 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards; }
  .countup    { animation:countup 0.6s ease forwards; }
  .gradient-orange { background:linear-gradient(135deg,#FF5722,#FF7043); }
  .gradient-lime   { background:linear-gradient(135deg,#AEEA00,#8BC34A); }
  .tab-item { cursor:pointer; transition:all 0.2s; border-bottom:2px solid transparent; color:#888; padding:12px 0; font-size:13px; font-weight:600; }
  .tab-item.active { color:#FF5722; border-color:#FF5722; }
  .order-card { background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.06); border-radius:20px; transition:all 0.3s ease; }
  .order-card.incoming { border-color:rgba(255,87,34,0.3); background:rgba(255,87,34,0.03); animation:ping 1.5s ease-in-out 3; }
  .stat-pill { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:16px; }
  .pulse-ring::before {
    content:''; position:absolute; inset:-6px; border-radius:50%;
    border:2px solid #AEEA00;
    animation:pulse-ring 2s ease-in-out infinite;
  }
  .btn-accept { background:linear-gradient(135deg,#AEEA00,#8BC34A); color:#000; font-weight:800; border:none; cursor:pointer; transition:all 0.2s; border-radius:16px; }
  .btn-accept:hover { transform:scale(1.02); box-shadow:0 8px 24px rgba(174,234,0,0.4); }
  .btn-decline { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.25); color:#f87171; font-weight:700; border-radius:16px; cursor:pointer; transition:all 0.2s; }
  .btn-decline:hover { background:rgba(239,68,68,0.2); }
  .map-placeholder { background:linear-gradient(135deg,#111,#1A1A1A); border:1px solid rgba(255,255,255,0.06); border-radius:20px; position:relative; overflow:hidden; }
  .map-placeholder::before { content:''; position:absolute; inset:0; background:radial-gradient(circle at 50% 60%, rgba(255,87,34,0.08) 0%, transparent 70%); }
  .earnings-bar { height:36px; border-radius:8px; background:linear-gradient(90deg,#FF5722,#FF7043); transition:width 0.8s cubic-bezier(0.4,0,0.2,1); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── Data ──────────────────────────────────────────────────
const WEEK_EARNINGS = [
  { day:'Mon', earnings:580,  deliveries:8 },
  { day:'Tue', earnings:420,  deliveries:6 },
  { day:'Wed', earnings:760,  deliveries:11 },
  { day:'Thu', earnings:690,  deliveries:9 },
  { day:'Fri', earnings:940,  deliveries:13 },
  { day:'Sat', earnings:1120, deliveries:16 },
  { day:'Sun', earnings:480,  deliveries:7 },
];

const COMPLETED_ORDERS = [
  { id:'ZAV-8921', from:'The Protein Kitchen', to:'Hostel Block 7',     amount:408, tip:20, time:'2:30 PM',  distance:'1.2 km', rating:5 },
  { id:'ZAV-8912', from:'Campus Bites',         to:'Boys PG, Sector 5', amount:138, tip:0,  time:'1:45 PM',  distance:'0.8 km', rating:4 },
  { id:'ZAV-8901', from:'Green Bowl',           to:'FitLife Studio',    amount:268, tip:30, time:'12:20 PM', distance:'2.1 km', rating:5 },
  { id:'ZAV-8887', from:'Muscle Meal Co.',      to:'NIT Campus Gate',   amount:699, tip:50, time:'11:05 AM', distance:'3.4 km', rating:5 },
];

// ── Icon ─────────────────────────────────────────────────
const Icon = ({ n, s=20 }) => {
  const map = {
    home:     <svg width={s} height={s} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
    orders:   <svg width={s} height={s} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>,
    wallet:   <svg width={s} height={s} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg>,
    location: <svg width={s} height={s} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>,
    star:     <svg width={s} height={s} fill="currentColor" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>,
    phone:    <svg width={s} height={s} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.26 2 2 0 0 1 3.6 1h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 8.6a16 16 0 0 0 6.08 6.08l.86-.86a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>,
    check:    <svg width={s} height={s} fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>,
    map:      <svg width={s} height={s} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>,
    trend:    <svg width={s} height={s} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
    clock:    <svg width={s} height={s} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
    bike:     <svg width={s} height={s} fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a1 1 0 0 0-1-1h-4"/><path d="m9 6 4 5.5"/><path d="M5.5 17.5 9 6"/><path d="m15 6 3 11.5"/><path d="M15 6h4"/></svg>,
    x:        <svg width={s} height={s} fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
  };
  return map[n] || null;
};

// ── New Order Notification ────────────────────────────────
const OrderAlert = ({ order, onAccept, onDecline }) => {
  const [timeLeft, setTimeLeft] = useState(30);

  useEffect(() => {
    const t = setInterval(() => {
      setTimeLeft(prev => {
        if (prev <= 1) { onDecline(); return 0; }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(t);
  }, []);

  return (
    <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-end" style={{animation:'fadeIn 0.2s ease'}}>
      <div className="w-full glass border-t border-white/10 rounded-t-3xl p-5 slide-in">
        {/* Timer ring */}
        <div className="flex justify-center mb-4">
          <div className="relative w-16 h-16">
            <svg className="w-full h-full -rotate-90" viewBox="0 0 64 64">
              <circle cx="32" cy="32" r="28" fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="4" />
              <circle cx="32" cy="32" r="28" fill="none" stroke="#FF5722" strokeWidth="4"
                strokeDasharray="175.9" strokeDashoffset={175.9 * (1 - timeLeft/30)}
                style={{transition:'stroke-dashoffset 1s linear'}} />
            </svg>
            <div className="absolute inset-0 flex items-center justify-center font-display font-black text-xl text-white">{timeLeft}</div>
          </div>
        </div>

        <div className="text-center mb-5">
          <div className="text-orange-400 text-xs font-bold uppercase tracking-widest mb-1">🔔 New Order Request</div>
          <h3 className="font-display font-black text-white text-2xl mb-1">{order.from}</h3>
          <p className="text-gray-400 text-sm">📍 Pickup → {order.to}</p>
        </div>

        <div className="grid grid-cols-3 gap-3 mb-5">
          {[['💰','Earnings','₹'+order.earning],['📏','Distance',order.distance],['⏱️','Est. Time',order.time]].map(([e,l,v]) => (
            <div key={l} className="stat-pill p-3 text-center">
              <div className="text-xl mb-1">{e}</div>
              <div className="font-bold text-white text-sm">{v}</div>
              <div className="text-gray-500 text-xs">{l}</div>
            </div>
          ))}
        </div>

        {/* Order items preview */}
        <div className="glass rounded-2xl p-3 mb-5">
          <div className="text-gray-400 text-xs mb-2">Order items</div>
          {order.items.map((item, i) => (
            <div key={i} className="flex justify-between text-sm">
              <span className="text-gray-300">{item.qty}× {item.name}</span>
              <span className="text-white font-semibold">₹{item.price}</span>
            </div>
          ))}
        </div>

        <div className="flex gap-3">
          <button onClick={onDecline} className="btn-decline flex-none px-5 py-3.5 flex items-center gap-2 text-sm">
            <Icon n="x" s={16} /> Decline
          </button>
          <button onClick={() => onAccept(order)} className="btn-accept flex-1 py-3.5 flex items-center justify-center gap-2 text-base">
            <Icon n="check" s={18} /> Accept Order — ₹{order.earning}
          </button>
        </div>
      </div>
    </div>
  );
};

// ── Active Delivery Card ──────────────────────────────────
const ActiveDelivery = ({ order, onComplete }) => {
  const [phase, setPhase] = useState(0); // 0=pickup, 1=delivering, 2=arrived
  const phases = ['🛵 Head to Restaurant', '📦 Picked Up — On the Way!', '🎯 Arrived at Drop Point'];
  const colors  = ['text-orange-400','text-blue-400','text-lime-400'];

  return (
    <div className="order-card p-4 mb-4 border border-orange-500/20 bg-orange-500/3">
      <div className="flex items-center gap-2 mb-3">
        <div className="w-2 h-2 rounded-full bg-orange-400 ping" />
        <span className="text-orange-400 text-xs font-bold uppercase tracking-widest">Active Delivery</span>
        <span className="ml-auto text-gray-500 text-xs font-mono">{order.id}</span>
      </div>

      {/* Phase indicator */}
      <div className={`font-display font-bold text-lg ${colors[phase]} mb-4`}>{phases[phase]}</div>

      {/* Route */}
      <div className="flex items-start gap-3 mb-4">
        <div className="flex flex-col items-center gap-1 pt-1">
          <div className="w-3 h-3 rounded-full bg-orange-400 shrink-0" />
          <div className="w-0.5 h-8 bg-orange-400/30" />
          <div className="w-3 h-3 rounded-full bg-lime-400 shrink-0" />
        </div>
        <div className="flex-1 space-y-4">
          <div>
            <div className="text-white font-semibold text-sm">{order.from}</div>
            <div className="text-gray-500 text-xs">📍 {order.fromAddr}</div>
          </div>
          <div>
            <div className="text-white font-semibold text-sm">{order.customer}</div>
            <div className="text-gray-500 text-xs">📍 {order.to}</div>
          </div>
        </div>
        <div className="text-right shrink-0">
          <div className="font-display font-black text-xl text-white">₹{order.earning}</div>
          <div className="text-gray-500 text-xs mt-0.5">{order.distance}</div>
        </div>
      </div>

      {/* Map placeholder */}
      <div className="map-placeholder h-36 mb-4 flex items-center justify-center">
        <div className="text-center relative z-10">
          <div className="text-4xl mb-2 animate-bounce">🛵</div>
          <div className="text-gray-400 text-xs">Live map · 1.2 km away</div>
          <div className="text-lime-400 text-xs mt-1 font-semibold">ETA 8 minutes</div>
        </div>
        {/* Fake route dots */}
        <div className="absolute inset-0 overflow-hidden">
          {[...Array(6)].map((_,i) => (
            <div key={i} className="absolute w-1.5 h-1.5 rounded-full bg-orange-400/40" style={{left:`${20+i*12}%`, top:`${30+i*5}%`}} />
          ))}
        </div>
      </div>

      {/* Actions */}
      <div className="flex gap-2">
        <button className="glass border border-white/10 rounded-xl px-4 py-2.5 text-gray-300 text-sm font-semibold flex items-center gap-2 hover:border-white/20 transition-colors">
          <Icon n="phone" s={15} /> Call Customer
        </button>
        {phase < 2 ? (
          <button onClick={() => setPhase(phase + 1)} className="flex-1 btn-accept py-2.5 text-sm flex items-center justify-center gap-2">
            {phase === 0 ? '✅ Picked Up' : '📍 Mark Arrived'}
          </button>
        ) : (
          <button onClick={() => onComplete(order)} className="flex-1 gradient-lime py-2.5 rounded-xl font-bold text-black text-sm flex items-center justify-center gap-2">
            🎉 Mark Delivered
          </button>
        )}
      </div>
    </div>
  );
};

// ── Main App ─────────────────────────────────────────────
const RiderApp = () => {
  const [tab,          setTab]          = useState('home');
  const [isOnline,     setIsOnline]     = useState(false);
  const [pendingOrder, setPendingOrder] = useState(null);
  const [activeOrder,  setActiveOrder]  = useState(null);
  const [todayStats,   setTodayStats]   = useState({ earnings:480, deliveries:7, online:'3h 24m', rating:4.9 });
  const [completed,    setCompleted]    = useState(COMPLETED_ORDERS);
  const [showEarned,   setShowEarned]   = useState(null);
  const timerRef = useRef(null);

  // Simulate incoming order when online
  useEffect(() => {
    if (!isOnline || activeOrder) return;
    timerRef.current = setTimeout(() => {
      setPendingOrder({
        id:       'ZAV-' + Math.floor(8930 + Math.random()*30),
        from:     'The Protein Kitchen',
        fromAddr: 'Shop 12, Campus Gate Road',
        to:       'Hostel Block 7, Room 312',
        customer: 'Rohan Sharma',
        earning:  72,
        distance: '1.8 km',
        time:     '~12 min',
        items:    [{ name:'High Protein Bowl', qty:1, price:249 }, { name:'Protein Shake', qty:1, price:159 }],
      });
    }, 6000);
    return () => clearTimeout(timerRef.current);
  }, [isOnline, activeOrder]);

  const handleAccept = (order) => {
    setPendingOrder(null);
    setActiveOrder(order);
  };

  const handleDecline = () => { setPendingOrder(null); };

  const handleComplete = (order) => {
    setActiveOrder(null);
    setTodayStats(s => ({ ...s, earnings: s.earnings + order.earning, deliveries: s.deliveries + 1 }));
    setCompleted(prev => [{
      id: order.id, from: order.from, to: order.to,
      amount: order.earning * 4, tip: Math.random() > 0.5 ? 20 : 0,
      time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
      distance: order.distance, rating: 5,
    }, ...prev]);
    setShowEarned(order.earning);
    setTimeout(() => setShowEarned(null), 3000);
  };

  const maxEarnings = Math.max(...WEEK_EARNINGS.map(d => d.earnings));

  return (
    <div className="flex flex-col min-h-screen">
      {/* Header */}
      <header className="glass border-b border-white/5 px-4 py-4 flex items-center gap-3">
        <div className="w-10 h-10 gradient-orange rounded-xl flex items-center justify-center font-bold text-white font-display">RK</div>
        <div className="flex-1">
          <div className="font-display font-black text-white">Rahul Kumar</div>
          <div className="flex items-center gap-2 text-xs">
            <span className="text-yellow-400">★ {todayStats.rating}</span>
            <span className="text-gray-500">·</span>
            <span className="text-gray-400">{todayStats.deliveries} deliveries today</span>
          </div>
        </div>

        {/* Online toggle */}
        <div className="flex flex-col items-center gap-1">
          <div
            onClick={() => { setIsOnline(!isOnline); if (!isOnline) setPendingOrder(null); }}
            className={`relative w-14 h-14 rounded-full flex items-center justify-center cursor-pointer transition-all duration-300 ${isOnline ? 'pulse-ring' : ''}`}
            style={{background: isOnline ? 'rgba(174,234,0,0.15)' : 'rgba(255,255,255,0.05)', border: isOnline ? '2px solid #AEEA00' : '2px solid rgba(255,255,255,0.1)'}}
          >
            <Icon n="bike" s={22} className={isOnline ? 'text-lime-400' : 'text-gray-500'} />
          </div>
          <span className={`text-xs font-bold ${isOnline ? 'text-lime-400' : 'text-gray-500'}`}>{isOnline ? 'Online' : 'Offline'}</span>
        </div>
      </header>

      {/* Earnings flash */}
      {showEarned && (
        <div className="fixed top-24 left-1/2 -translate-x-1/2 z-50 gradient-lime px-6 py-3 rounded-2xl font-display font-black text-black text-xl shadow-2xl countup">
          +₹{showEarned} 🎉
        </div>
      )}

      {/* Tabs */}
      <div className="flex border-b border-white/5 px-4">
        {[['home','🏠 Home'],['map','🗺 Map'],['earnings','💰 Earnings'],['history','📋 History']].map(([id,label]) => (
          <button key={id} onClick={() => setTab(id)} className={`tab-item flex-1 text-center ${tab===id ? 'active' : ''}`}>{label}</button>
        ))}
      </div>

      {/* Content */}
      <div className="flex-1 p-4 overflow-y-auto pb-8">

        {/* HOME TAB */}
        {tab === 'home' && (
          <div className="fade-up space-y-4">
            {/* Status Banner */}
            {!isOnline ? (
              <div className="glass border border-white/5 rounded-2xl p-6 text-center">
                <div className="text-5xl mb-3">😴</div>
                <div className="font-display font-black text-white text-xl mb-2">You're Offline</div>
                <p className="text-gray-400 text-sm mb-4">Go online to start receiving delivery requests</p>
                <button onClick={() => setIsOnline(true)} className="btn-accept w-full py-4 text-base font-display font-black">
                  🟢 Go Online & Earn
                </button>
              </div>
            ) : activeOrder ? (
              <ActiveDelivery order={activeOrder} onComplete={handleComplete} />
            ) : (
              <div className="glass border border-lime-500/20 bg-lime-500/3 rounded-2xl p-6 text-center">
                <div className="text-5xl mb-3 animate-bounce">👀</div>
                <div className="font-display font-black text-lime-400 text-xl mb-1">Looking for orders...</div>
                <p className="text-gray-400 text-sm">Orders will appear here automatically</p>
                <div className="flex justify-center gap-2 mt-4">
                  {[...Array(3)].map((_,i) => (
                    <div key={i} className="w-2 h-2 rounded-full bg-lime-400/40 ping" style={{animationDelay:`${i*0.3}s`}} />
                  ))}
                </div>
              </div>
            )}

            {/* Today Stats */}
            <div className="grid grid-cols-2 gap-3">
              {[['💰','₹'+todayStats.earnings,'Today Earnings'],['📦',todayStats.deliveries,'Deliveries'],['⏱️',todayStats.online,'Online Time'],['⭐',todayStats.rating,'Rating']].map(([e,v,l]) => (
                <div key={l} className="stat-pill p-4 flex items-center gap-3">
                  <span className="text-2xl">{e}</span>
                  <div>
                    <div className="font-display font-black text-white text-lg">{v}</div>
                    <div className="text-gray-500 text-xs">{l}</div>
                  </div>
                </div>
              ))}
            </div>

            {/* Recent */}
            <div>
              <div className="text-white font-display font-bold mb-3">Recent Deliveries</div>
              {completed.slice(0,3).map((o, i) => (
                <div key={i} className="flex items-center gap-3 py-3 border-b border-white/5">
                  <div className="w-10 h-10 gradient-orange rounded-xl flex items-center justify-center font-bold text-white text-xs">{i+1}</div>
                  <div className="flex-1 min-w-0">
                    <div className="text-white text-sm font-medium truncate">{o.from}</div>
                    <div className="text-gray-500 text-xs">{o.time} · {o.distance}</div>
                  </div>
                  <div className="text-right shrink-0">
                    <div className="text-lime-400 font-bold text-sm">+₹{Math.floor(o.amount*0.18)}</div>
                    {o.tip > 0 && <div className="text-yellow-400 text-xs">+₹{o.tip} tip</div>}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* MAP TAB */}
        {tab === 'map' && (
          <div className="fade-up">
            <div className="map-placeholder h-64 mb-4 flex items-center justify-center relative">
              <div className="text-center relative z-10">
                <div className="text-6xl mb-2">🗺️</div>
                <div className="text-gray-400 text-sm">Live Map View</div>
                <div className="text-orange-400 text-xs mt-1">Connect Google Maps API</div>
              </div>
              {/* Fake pins */}
              {[['15%','25%','🍽️'],['55%','40%','🛵'],['75%','65%','📍'],['30%','70%','🏠']].map(([l,t,e],i) => (
                <div key={i} className="absolute text-xl z-10" style={{left:l, top:t}}>{e}</div>
              ))}
            </div>
            <div className="glass border border-white/5 rounded-2xl p-4">
              <div className="font-display font-bold text-white mb-3">Nearby Hot Zones</div>
              {['IIT Delhi Campus','Hostel Zone B','FitLife Gym District','NIT Warangal Gate'].map((zone, i) => (
                <div key={i} className="flex items-center gap-3 py-2.5 border-b border-white/5 last:border-0">
                  <div className="w-2 h-2 rounded-full" style={{background: i<2 ? '#FF5722' : '#AEEA00'}} />
                  <span className="text-gray-300 text-sm flex-1">{zone}</span>
                  <span className="text-xs text-gray-500">{[12,8,5,3][i]} orders</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* EARNINGS TAB */}
        {tab === 'earnings' && (
          <div className="fade-up space-y-4">
            {/* This week summary */}
            <div className="glass border border-white/5 rounded-2xl p-5">
              <div className="text-gray-400 text-xs uppercase tracking-widest mb-1">This Week</div>
              <div className="font-display font-black text-4xl text-white mb-1">
                ₹{WEEK_EARNINGS.reduce((s,d)=>s+d.earnings,0).toLocaleString()}
              </div>
              <div className="text-lime-400 text-sm font-semibold">
                +18% vs last week · {WEEK_EARNINGS.reduce((s,d)=>s+d.deliveries,0)} deliveries
              </div>
            </div>

            {/* Bar chart */}
            <div className="glass border border-white/5 rounded-2xl p-4">
              <div className="text-white font-display font-bold mb-4">Daily Earnings</div>
              <div className="flex items-end gap-2 h-28">
                {WEEK_EARNINGS.map((d, i) => (
                  <div key={i} className="flex-1 flex flex-col items-center gap-1">
                    <div className="w-full rounded-t-lg gradient-orange" style={{height:`${(d.earnings/maxEarnings)*100}px`, opacity:0.5+(i/7)*0.5}} />
                    <div className="text-gray-500 text-xs">{d.day}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Breakdown */}
            <div className="glass border border-white/5 rounded-2xl p-4">
              <div className="text-white font-display font-bold mb-4">Earnings Breakdown</div>
              {[['🚗 Base Earnings','₹3,200'],['🎁 Tips','₹420'],['⚡ Surge Bonus','₹240'],['🏆 Performance Bonus','₹130']].map(([l,v]) => (
                <div key={l} className="flex items-center justify-between py-2.5 border-b border-white/5 last:border-0">
                  <span className="text-gray-300 text-sm">{l}</span>
                  <span className="text-white font-bold">{v}</span>
                </div>
              ))}
              <div className="flex items-center justify-between pt-3 mt-1">
                <span className="font-display font-bold text-white">Total</span>
                <span className="font-display font-black text-xl text-lime-400">₹3,990</span>
              </div>
            </div>

            {/* Payout */}
            <div className="glass border border-lime-500/20 bg-lime-500/3 rounded-2xl p-4">
              <div className="font-display font-bold text-white mb-1">Next Payout</div>
              <div className="text-lime-400 text-2xl font-black mb-2">₹3,990</div>
              <div className="text-gray-400 text-sm">UPI: rahul.k@paytm · Monday, 6 PM</div>
            </div>
          </div>
        )}

        {/* HISTORY TAB */}
        {tab === 'history' && (
          <div className="fade-up">
            <div className="text-white font-display font-bold mb-4">Delivery History ({completed.length})</div>
            {completed.map((o, i) => (
              <div key={i} className="order-card p-4 mb-3">
                <div className="flex items-start gap-3 mb-2">
                  <div className="w-10 h-10 gradient-orange rounded-xl flex items-center justify-center font-bold text-white text-xs shrink-0">
                    {completed.length - i}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center justify-between">
                      <span className="font-mono text-orange-400 text-xs font-bold">{o.id}</span>
                      <span className="text-gray-500 text-xs">{o.time}</span>
                    </div>
                    <div className="text-white font-medium text-sm mt-0.5">{o.from}</div>
                    <div className="text-gray-500 text-xs">→ {o.to}</div>
                  </div>
                </div>
                <div className="flex items-center justify-between text-sm pt-2 border-t border-white/5">
                  <div className="flex items-center gap-3 text-gray-400">
                    <span className="flex items-center gap-1"><Icon n="location" s={12} />{o.distance}</span>
                    <span className="flex items-center gap-1">
                      {[...Array(o.rating)].map((_,i) => <Icon key={i} n="star" s={11} className="text-yellow-400" />)}
                    </span>
                  </div>
                  <div className="text-right">
                    <span className="text-lime-400 font-bold">+₹{Math.floor(o.amount*0.18)}</span>
                    {o.tip > 0 && <span className="text-yellow-400 text-xs ml-1">+₹{o.tip} tip</span>}
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Incoming Order Alert */}
      {pendingOrder && (
        <OrderAlert
          order={pendingOrder}
          onAccept={handleAccept}
          onDecline={handleDecline}
        />
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<RiderApp />);
</script>
</body>
</html>
